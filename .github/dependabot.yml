version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before proposing them (supply-chain buffer).
    # Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      # livekit-agents pins its sibling packages exactly, so move them together.
      livekit:
        patterns:
          - "livekit*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
