[project]
name = "livekit-agent"
version = "0.1.0"
description = "LiveKit example voice agent"
requires-python = ">=3.14,<3.15"
dependencies = [
  "livekit-agents[openai,silero,deepgram,cartesia,turn-detector]~=1.9",
  "exa-py>=2.29,<3",
  "prefactor-livekit>=0.1.5,<0.2",
  "python-dotenv>=1.2,<2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
